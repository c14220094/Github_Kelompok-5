<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>3D Pikachu – WebGL (Upright, Env fixed)</title>
  <style>
    html,body{height:100%;margin:0}
    body{overflow:hidden;font-family:system-ui,Arial,sans-serif}
    #glcanvas{width:100vw;height:100vh;display:block;background:#000}
    .panel{
      position:fixed;left:14px;top:14px;background:rgba(255,255,255,.92);
      border-radius:12px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.12);
      font-size:14px;line-height:1.45
    }
    kbd{font:600 12px/1 system-ui,Arial;padding:2px 6px;border-radius:6px;border:1px solid #d0d7de;background:#f6f8fa;box-shadow:inset 0 -1px 0 #d0d7de;margin-right:6px}
    .score{
      position:fixed;left:14px;bottom:14px;background:rgba(255,255,255,.92);
      border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.12);font-size:13px
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <script src="libs.js"></script>
  <script src="main.js"></script>
</body>
</html>
