<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            line-height: 1.7;
            max-width: 320px;
            z-index: 100;
        }
        
        .info-panel h2 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 8px;
        }
        
        .control {
            margin: 10px 0;
            color: #555;
        }
        
        .control kbd {
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid #ddd;
            font-weight: bold;
        }
        
        .stats {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 13px;
            font-family: monospace;
            z-index: 100;
        }
        
        .stat-item {
            margin: 6px 0;
            color: #666;
        }

        .stat-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>

    <script id="vertex-shader" type="x-shader/x-vertex">
        precision highp float;
        
        attribute vec3 aVertexPosition;
        attribute vec3 aVertexNormal;
        attribute vec3 aVertexColor;
        
        uniform mat4 uPMatrix;
        uniform mat4 uMVMatrix;
        uniform mat4 uNMatrix;
        
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vColor;
        
        void main() {
            gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
            vPosition = vec3(uMVMatrix * vec4(aVertexPosition, 1.0));
            vNormal = normalize(mat3(uNMatrix) * aVertexNormal);
            vColor = aVertexColor;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision highp float;
        
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vColor;
        
        void main() {
            vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
            vec3 viewDir = normalize(-vPosition);
            
            float diffuse = max(dot(vNormal, lightDir), 0.3);
            float specular = pow(max(dot(reflect(-lightDir, vNormal), viewDir), 0.0), 16.0) * 0.4;
            
            vec3 finalColor = vColor * diffuse + vec3(1.0) * specular;
            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
    <script src="main.js"></script>
</body>
</html>
